name: recipes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No install step on purpose: these run on the standard library alone.
      # If this job ever needs a dependency, that is a regression.
      - run: python3 run_all.py --check
